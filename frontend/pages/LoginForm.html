<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Prevent caching of login page -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <link rel="stylesheet" href="../css/LoginForm.css">
    <link rel="stylesheet" href="../assets/css/custom-alert.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .input-box {
            position: relative;
        }
        
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #666;
            transition: color 0.3s;
        }
        
        .toggle-password:hover {
            color: #333;
        }
        
        .input-box input[type="password"],
        .input-box input[type="text"]#password {
            padding-right: 45px;
        }

        /* Logout success message */
        .logout-success {
            background: #d1fae5;
            color: #065f46;
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            display: none;
            animation: slideDown 0.3s ease;
            font-weight: 500;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>

    <!-- Check if user is already logged in or just logged out -->
    <script>
        (function() {
            // Check if user just logged out
            const justLoggedOut = sessionStorage.getItem('justLoggedOut');
            if (justLoggedOut === 'true') {
                sessionStorage.removeItem('justLoggedOut');
                // Show logout success message
                window.addEventListener('DOMContentLoaded', function() {
                    const successDiv = document.getElementById('logoutSuccess');
                    if (successDiv) {
                        successDiv.style.display = 'block';
                        setTimeout(() => {
                            successDiv.style.display = 'none';
                        }, 4000);
                    }
                });
                return; // Don't redirect, user just logged out
            }

            // If user is already authenticated, redirect to appropriate dashboard
            const token = localStorage.getItem('token') || localStorage.getItem('authToken');
            const userStr = localStorage.getItem('user') || localStorage.getItem('currentUser');
            
            if (token && userStr) {
                try {
                    const user = JSON.parse(userStr);
                    console.log('✅ User already logged in, redirecting...');
                    
                    // Redirect based on role
                    const redirectMap = {
                        'admin': '/pages/AdminDashboard.html',
                        'student': '/pages/StudentDashboard.html',
                        'teacher': '/pages/TeacherDashboard.html'
                    };
                    
                    const redirectPath = redirectMap[user.role] || '/pages/Dashboard.html';
                    window.location.replace(redirectPath);
                } catch (e) {
                    console.error('Error parsing user data:', e);
                    // Clear invalid data
                    localStorage.removeItem('user');
                    localStorage.removeItem('currentUser');
                    localStorage.removeItem('token');
                    localStorage.removeItem('authToken');
                }
            }
        })();
    </script>
</head>

<body>

    <div class="wrapper">
        <form id="loginForm">
            
            <div class="logo">
                <img src="/images/cscqcph (3).png" alt="School Logo">
            </div>

            <h1>Login</h1>

            <!-- Logout success message -->
            <div id="logoutSuccess" class="logout-success">
                ✓ You have been successfully logged out
            </div>

            <div id="errorMessage" class="error-box" style="display: none;"></div> 
            <div id="successMessage" style="display: none;"></div>

            <!-- Username -->
            <div class="input-box">
                <input type="text" id="username" placeholder="Username" required>
            </div>

            <!-- Password with Eye Icon -->
            <div class="input-box">
                <input type="password" id="password" placeholder="Password" required>
                <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
            </div>

            <!-- Remember / Forgot -->
            <div class="remember-forgot">
                <label><input type="checkbox"> Remember me</label>
                <a href="#" id="forgotPasswordLink">Forgot Password?</a>
            </div>

            <!-- Login button -->
            <button type="submit" class="login-btn">Login</button>

        </form>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgotPasswordModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Forgot Password</h2>
            <p>Enter your username and email to receive a temporary password.</p>

            <input type="text" id="fpUsername" placeholder="Username" required>
            <input type="email" id="fpEmail" placeholder="Email Address" required>
            <button id="sendTempPasswordBtn">Send Temporary Password</button>
            <div id="fpMessage" class="fp-message"></div>
        </div>
    </div>

    <!-- API Client + Alert + Login JS -->
    <script src="../api/api-client.js"></script>
    <script src="../assets/js/custom-alert.js"></script>
    <script src="../js/Login.js"></script>
    
    <!-- Eye Icon Toggle Script -->
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        
        togglePassword.addEventListener('click', function() {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });
    </script>

</body>
</html>
